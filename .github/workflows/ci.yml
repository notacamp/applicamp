name: CI

# Every deterministic code gate. Job names are short because the workflow
# name is the section on a PR: `CI / rust`, `CI / deny`, … A job name is a
# required-check interface: renaming one means updating the branch ruleset
# in the same change. Agents never build or test locally (AGENTS.md); this
# is the test runner.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Line numbers in backtraces without full debug info: faster links and
  # smaller caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2, reads rust-toolchain.toml
        with: { cache: false }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - name: Format
        if: always()
        run: cargo fmt --all --check
      - name: Clippy
        if: always()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Architecture (module boundaries, migrations, operation security, documented routes)
        if: always()
        run: cargo xtask arch
      - name: Sandbox policies (enforced endpoints, Landlock required, no forbidden or internal host)
        if: always()
        run: cargo xtask policies
      - name: OpenAPI drift
        id: openapi
        if: always()
        run: cargo xtask openapi --check
      # On drift, write the document the server generates and upload it, so a
      # change can commit it without compiling the server locally
      # (`gh run download <run> -n generated-openapi -D openapi`). The check
      # above still fails the job.
      - name: Generate the stale OpenAPI document
        if: always() && steps.openapi.outcome == 'failure'
        run: cargo xtask openapi
      - name: Upload the generated OpenAPI document
        if: always() && steps.openapi.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-openapi
          path: openapi/openapi.json
          retention-days: 7
          if-no-files-found: error

  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: applicamp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # `#[sqlx::test]` creates a fresh database per test on this server.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/applicamp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2, reads rust-toolchain.toml
        with: { cache: false }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: { tool: cargo-nextest }
      # The runs module's lifecycle tests start the real agent runner under
      # the fake sandbox runtime (target/debug/applicamp-agent).
      - name: Build the agent runner
        run: cargo build --locked --package applicamp-agent --bin applicamp-agent
      - name: Tests
        run: cargo nextest run --workspace --locked --no-tests=fail --no-fail-fast

  rust:
    # The required check: every Rust job above passed.
    if: always()
    needs: [rust-checks, rust-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "rust-checks, rust-tests: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  image:
    # On a pull request: builds the release image exactly as published (one
    # architecture) and scans it. Not pushed; `publish.yml` pushes on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # @notacamp/ui, from GitHub Packages, for the web stage.
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: applicamp:ci
          build-args: GIT_SHA=${{ github.sha }}
          # A BuildKit secret, never a build arg: it is in no layer.
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: agent
          load: true
          tags: applicamp-agent:ci
          build-args: GIT_SHA=${{ github.sha }}
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
      - name: The agent image's runner runs
        run: docker run --rm applicamp-agent:ci --version
      - name: Trivy on the agent image (HIGH/CRITICAL, fixable)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: applicamp-agent:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      - name: The image's binary runs and the web client is in it
        run: |
          docker run --rm applicamp:ci --version
          docker run --rm applicamp:ci openapi > /dev/null
          id=$(docker create applicamp:ci)
          docker cp "$id:/app/web/index.html" - | tar -xO | grep -q '<div id="root">'
          docker rm "$id" > /dev/null
      - name: Trivy (HIGH/CRITICAL, fixable)
        # Pinned by SHA: this action's tags have been tampered with before.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: applicamp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  # The web client (clients/): the gates of AGENTS.md, then the build the
  # image serves. Agents never run these locally; this is the test runner.
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    defaults:
      run: { working-directory: clients }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { package_json_file: clients/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: clients/.nvmrc
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml
      - name: Install
        # The token reads @notacamp/ui from GitHub Packages, for this step only.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint, incl. no className or style outside lib, data-testid locators)
        if: always()
        run: pnpm lint
      - name: Format
        if: always()
        run: pnpm format:check
      - name: Typecheck
        if: always()
        run: pnpm typecheck
      - name: Module boundaries (dependency-cruiser)
        if: always()
        run: pnpm deps:check
      - name: Generated API types are current
        id: api-types
        if: always()
        run: pnpm api:check
      # On drift, upload what `api:check` generated, so a change can commit it
      # without generating it locally
      # (`gh run download <run> -n generated-api-types -D clients/app/src/lib/api`).
      - name: Upload the generated API types
        if: always() && steps.api-types.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-api-types
          path: clients/app/src/lib/api/schema.gen.ts
          retention-days: 7
          if-no-files-found: error
      - name: Translations at parity (en, pt-PT, es-ES, fr)
        if: always()
        run: pnpm i18n:check
      - name: Tests (+ coverage of lib and modules, 80% or more)
        if: always()
        run: pnpm test
      - name: Build
        if: always()
        run: pnpm build
      - name: Audit (prod deps)
        if: always()
        run: pnpm audit --prod

  e2e:
    # One happy path through the real stack: the release image (server and
    # built client) with Postgres, from deploy/compose.yml, and a fake
    # Campbooks to sign in with (deploy/compose.e2e.yml). Builds on the image
    # job's layer cache.
    if: github.event_name == 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      APPLICAMP_IMAGE: applicamp:e2e
      COMPOSE: docker compose -f compose.yml -f compose.e2e.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: applicamp:e2e
          build-args: GIT_SHA=${{ github.sha }}
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { package_json_file: clients/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: clients/.nvmrc
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml
      - name: Install the client's tools and Chromium
        working-directory: clients
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @applicamp/app exec playwright install --with-deps chromium
      - name: Start the stack and invite the demo address
        working-directory: deploy
        run: |
          printf 'POSTGRES_PASSWORD=e2e-only\n' > .env
          # `up` starts the server once Postgres and the fake are healthy and
          # the secret key exists; then wait for the server itself.
          $COMPOSE up -d
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/healthz > /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:8080/healthz
          $COMPOSE exec -T server /app/applicamp invite add demo@example.com
      - name: Playwright (happy path + axe)
        working-directory: clients
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_HOST_RULES: MAP fake-oidc 127.0.0.1
        run: pnpm e2e
      - name: The stack's logs
        if: failure()
        working-directory: deploy
        run: $COMPOSE logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            clients/app/playwright-report
            clients/app/test-results
          retention-days: 7
          if-no-files-found: ignore
