name: Publish

# Every push to main builds the server image on amd64 and arm64 (natively),
# publishes it as ghcr.io/notacamp/applicamp:main-<sha> (12 characters) and
# :main, scans the published manifest with Trivy and attests its provenance.
#
# TODO(notacamp/applicamp-cloud#1): dispatch the staging deploy of the new
# tag to the private cloud repo once its pipeline exists (Campbooks Next's
# publish workflow sends a repository_dispatch; this one does not yet).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/applicamp

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest, pair: linux-amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, pair: linux-arm64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: sha
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          # @notacamp/ui from GitHub Packages for the web stage: a BuildKit
          # secret, never a build arg.
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}
          # Provenance is attested on the final multi-arch manifest below;
          # per-platform attestation manifests would leak `unknown/unknown`
          # entries into it.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.short }}
            org.opencontainers.image.licenses=LicenseRef-Sustainable-Use
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ matrix.pair }}
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ matrix.pair }},mode=max
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests--${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing of the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests--*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          SHA: ${{ github.sha }}
        run: |
          tag="main-${SHA:0:12}"
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$REGISTRY_IMAGE:$tag" -t "$REGISTRY_IMAGE:main" \
            $(printf "$REGISTRY_IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$REGISTRY_IMAGE:$tag"
          digest=$(docker buildx imagetools inspect "$REGISTRY_IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $REGISTRY_IMAGE:$tag and :main → $digest" >> "$GITHUB_STEP_SUMMARY"
      # Only the Trivy exceptions file: this job publishes what the build jobs
      # made and needs nothing else from the repository.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: .trivyignore.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Trivy (HIGH/CRITICAL, fixable)
        # Pinned by SHA: this action's tags have been tampered with before.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}@${{ steps.manifest.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
