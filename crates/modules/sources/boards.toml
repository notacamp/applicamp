# Public job boards searched for every account: the seed list.
#
# Companies that publish their jobs on a public Greenhouse, Lever or Ashby
# job-board API and hire in Europe (PT, ES, FR, DE, NL, UK, IE, ...) or
# remotely. Every token was checked on 2026-10-26: its public API answered
# 200 with at least one job, some of them in Europe or remote, in a body
# under the readers' 2 MB cap. Company names are public business names.
#
# The APIs read (and nothing else):
#   greenhouse  https://boards-api.greenhouse.io/v1/boards/<token>/jobs
#   lever       https://api.lever.co/v0/postings/<token>?mode=json
#               (https://api.eu.lever.co/... when `eu = true`)
#   ashby       https://api.ashbyhq.com/posting-api/job-board/<token>
#
# To add a company: find its board token (the path segment after
# boards.greenhouse.io/, jobs.lever.co/ or jobs.ashbyhq.com/), check the API
# above answers 200 with jobs, and add a [[board]] below. Never add a board
# that is not the company's own public ATS board. A board added by link in
# the app is stored in the database, not here.

