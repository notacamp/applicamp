# Typical pay per country, in euros a year: the benchmark a country-scoped
# board ranks by when it lists fewer than 10 salaries
# (crates/modules/sources/src/pay.rs). Refreshed yearly.
#
# Only figures read from a public source are here; a country without one is
# left out (its boards rank on their own salaries, or last).
#
# Two sources, each row naming its own:
# - Eurostat, Structure of Earnings Survey 2022 (dataset earn_ses22_28, last
#   updated 2026-02-09): mean annual gross earnings of professionals (ISCO-08
#   major group 2), enterprises with 10 or more employees, in euros. Read
#   2026-10-27.
# - Stack Overflow Developer Survey 2025, "Salary by developer type": median
#   annual total compensation of back-end developers, in US dollars, converted
#   at 0.92 EUR per USD (the fixed table of the salary floor). Read 2026-10-27.
#
# The two measure different things (all professionals vs back-end developers):
# a rough order of countries, never a salary.

[[country]]
code = "CH"
eur_year = 120651
source = "Eurostat SES 2022 (earn_ses22_28), professionals, mean"
url = "https://ec.europa.eu/eurostat/databrowser/view/earn_ses22_28/default/table"
year = 2022

