[[board]]
slug = "startup-jobs"
name = "Startup Jobs"
homepage = "https://startup.jobs"
kind = "json_api"
priority = "high"
status = "candidate"
found_through = "the app's own research of 2026-11-04"

# Its API needs a free key (an account on startup.jobs; 401 without it). The
# mapping follows its OpenAPI description (https://api.startup.jobs/v1/openapi.json,
# read 2026-11-04). Its documentation says to send the key as a bearer token
# (`Authorization: Bearer sj_...`) and adds that "for quick experiments you can
# also pass it as an `api_key` query parameter", which is what the key's
# parameter below does. If its answer still says 401 once a key is set, the
# app cannot send a bearer header yet. Its RSS feed (/feeds/jobs) is NOT used:
# its terms forbid reusing its feeds "including RSS feeds" outside the API.
# 20 requests a minute per key; the list holds the last 14 days.
[board.config]
endpoint = "https://api.startup.jobs/v1/jobs"
query = { workplace_type = "remote", limit = "50" }
items = "/data"
cursor = { param = "starting_after", from = "/next_cursor" }
max_pages = 3
poll_minutes = 360
min_interval_ms = 3100
remote_only = true
key = { params = ["api_key"], how = "Create a free Startup Jobs account, then ask for an API key on its API page.", url = "https://startup.jobs/api" }

[board.config.fields]
ref = "/id"
title = "/title"
company = "/company/name"
company_url = "/company/website_url"
# The job's page on startup.jobs: applications go through it.
url = "/url"
location = "/location/country"
description = "/description_html"
posted_at = "/published_at"
salary_text = "/salary"

[board.terms]
attribution = "Startup Jobs"
link_back = true
follow = true
no_redistribution = true
notes = "Mention Startup Jobs as the source wherever its data is shown, link the job title to its page (dofollow), keep the attribution paragraph that ends each description, and refresh or delete fetched content within seven days. Its terms accept \"Personal automations, bots, newsletters, and job-search tools that link back to Startup Jobs\"."
sources = ["https://startup.jobs/terms/api", "https://startup.jobs/api"]

[board.report]
notes = "Startup jobs, very many remote (50 new remote engineering jobs in about 11 hours). Needs a free API key. Its main terms forbid reusing its RSS feeds, so only the API is read."
