# --- Research of 2026-11-04 (#75) ---------------------------------------------
#
# Every board below was read once on 2026-11-04 (its feed or API, robots.txt
# and terms; the answers are the fixtures in readers/fixtures/boards/). All are
# candidates: the owner approves each on the Boards page.
#
# Not seeded, on purpose: Hacker News "jobs" (the official Firebase API,
# https://hacker-news.firebaseio.com/v0/jobstories.json). It answers a list of
# ids and then one request per id (/v0/item/<id>.json); the readers here take
# one answer holding the items, so it cannot be expressed as a board config.
# It has no company, place or pay fields either (they are in the title), only
# about 5 posts a week, mostly US on site. Its README says "There is currently
# no rate limit", but Y Combinator's terms forbid data mining and commercial
# use unless authorized; it stays a question for the owner, not a board.

[[board]]
slug = "4dayweek"
name = "4 Day Week"
homepage = "https://4dayweek.io"
kind = "json_api"
priority = "high"
status = "candidate"
found_through = "the app's own research of 2026-11-04"

# Public API, no key (read 2026-11-04). robots.txt: `Allow: /api/v2`. 60
# requests a minute per IP, "a few polls per hour is plenty"; answers are cached
# 60 seconds. `work_arrangement=remote&category=engineering` finds about 2 000
# jobs, 100 a page. It writes salaries in cents (salary_divisor).
[board.config]
endpoint = "https://4dayweek.io/api/v2/jobs"
query = { work_arrangement = "remote", category = "engineering", limit = "100" }
items = "/data"
page_param = "page"
max_pages = 3
poll_minutes = 60
min_interval_ms = 1100
remote_only = true
salary_divisor = 100.0

[board.config.fields]
ref = "/id"
title = "/title"
company = "/company/name"
company_url = "/company/website"
# The job's page on 4dayweek.io: the visible link back. There is no separate
# apply link.
url = "/url"
location = "/locations/0/country"
description = "/description"
posted_at = "/posted_at"
salary_min = "/salary_min"
salary_max = "/salary_max"
salary_currency = "/salary_currency"
salary_period = "/salary_period"

[board.terms]
attribution = "4dayweek.io"
link_back = true
follow = true
no_redistribution = true
notes = "Credit 4dayweek.io as the source and link to the page it returns for each job or employer. Stay within the rate limits (60 requests a minute). Do not present the results as your own research, and do not use them \"to build, train or populate a competing job board or a substantially similar database of employers or listings\". Stop using the results and delete stored copies within 30 days of a revocation."
sources = ["https://4dayweek.io/terms", "https://4dayweek.io/developers"]

[board.report]
notes = "Remote engineering jobs, mostly at companies in the US; about 6 in 10 state a salary, which it writes in cents. Only a few companies hire worldwide. Its licence asks for credit and a link to each job, and forbids using the results for a competing job board."

