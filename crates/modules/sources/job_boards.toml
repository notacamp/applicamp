title = "/title"
company = "/company_name"
url = "/url"
apply_url = "/url"
location = "/location"
description = "/description"
posted_at = "/created_at"

[board.terms]
attribution = "Arbeitnow"
link_back = true
follow = true
apply_unchanged = true
notes = "Remote jobs only (remote=true, and the job's own remote flag). Hourly at most. Link back to the job on Arbeitnow."
sources = ["https://www.arbeitnow.com/blog/job-board-api"]

