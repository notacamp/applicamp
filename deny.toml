# cargo-deny: advisories, licenses, bans and sources for the Rust workspace.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
# Vulnerability and unsoundness advisories always fail (cargo-deny default).
yanked = "deny"
ignore = [
    # Unmaintained, not a vulnerability: lopdf (under pdf-extract, the PDF text
    # extractor of profile imports, #4) depends on it to measure the TrueType
    # fonts it embeds when *writing* PDFs, which Applicamp never does. Drop
    # this once lopdf moves off it.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; only lopdf's PDF writer uses it" },
]

[licenses]
confidence-threshold = 0.9
# Only licences something in the graph actually needs; add more with a reason.
allow = [
    "MIT",                 # most of the ecosystem (often as MIT OR Apache-2.0)
    "Apache-2.0",          # rustls, aws-lc-rs, tokio-adjacent crates without an MIT option
    "BSD-3-Clause",        # aws-lc-sys (AND-combined), subtle
    "ISC",                 # aws-lc-sys/aws-lc-rs (AWS-LC crypto, via rustls), untrusted
    "Unicode-3.0",         # ICU data/normalisation crates (via url -> idna)
    "Zlib",                # foldhash (via hashbrown <- sqlx-core)
    "CDLA-Permissive-2.0", # Mozilla CA root data: webpki-roots (sqlx), webpki-root-certs (reqwest)
]

[licenses.private]
# All workspace crates are `publish = false` under LicenseRef-Sustainable-Use;
# they are ours and need no allow-list entry.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # rustls everywhere: no OpenSSL / platform TLS stacks.
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# NVIDIA OpenShell's Rust SDK is published as a git tag (ADR 0002); the runs
# module will depend on it.
allow-git = ["https://github.com/NVIDIA/OpenShell"]
