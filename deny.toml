# cargo-deny: advisories, licenses, bans and sources for the Rust workspace.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
# Vulnerability and unsoundness advisories always fail (cargo-deny default).
yanked = "deny"
ignore = [
    # Unmaintained, not a vulnerability: lopdf (under pdf-extract, the PDF text
    # extractor of profile imports, #4) depends on it to measure the TrueType
    # fonts it embeds when *writing* PDFs, which Applicamp never does. Drop
    # this once lopdf moves off it.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; only lopdf's PDF writer uses it" },
    # Typst (compiled inside the server to render the tailored CV, #38) pulls in
    # parsers for things the CV never uses: bibliographies (hayagriva, citationberg,
    # biblatex, serde_yaml), syntax-highlighting definitions (syntect, two-face) and
    # SVG text shaping (rustybuzz). Our World hands the compiler one fixed embedded
    # template and no files, so nothing a person writes is ever parsed by any of
    # them: the person's text is data in `sys.inputs`, never markup (see
    # openspec/specs/pipeline/spec.md, "The CV as a PDF").
    { id = "RUSTSEC-2026-0194", reason = "quick-xml (citationberg, plist): no XML is ever parsed; the World serves no files" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml (citationberg, plist): no XML is ever parsed; the World serves no files" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained; typst's own shaper, no input of ours reaches it beyond the CV's text" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1 is unmaintained; syntect loads its own embedded dumps, never ours" },
    { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained proc-macro (hayagriva), compile time only" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml (serde_yaml, hayagriva) is unmaintained; no YAML is ever parsed" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust (syntect) is unmaintained; no YAML is ever parsed" },
    # NVIDIA OpenShell's SDK (the runs module's sandboxes, ADR 0002) reads PEM
    # through openshell-core; we hand it the gateway's CA only. Drop this once
    # OpenShell moves to rustls-pki-types' PEM parser.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained; openshell-core parses only the gateway CA we configure with it" },
]

[licenses]
confidence-threshold = 0.9
# Only licences something in the graph actually needs; add more with a reason.
allow = [
    "MIT",                 # most of the ecosystem (often as MIT OR Apache-2.0)
    "Apache-2.0",          # rustls, aws-lc-rs, tokio-adjacent crates without an MIT option
    "BSD-3-Clause",        # aws-lc-sys (AND-combined), subtle
    "ISC",                 # aws-lc-sys/aws-lc-rs (AWS-LC crypto, via rustls), untrusted
    "Unicode-3.0",         # ICU data/normalisation crates (via url -> idna)
    "Zlib",                # foldhash (via hashbrown <- sqlx-core)
    "CDLA-Permissive-2.0", # Mozilla CA root data: webpki-roots (sqlx), webpki-root-certs (reqwest)
    # Typst, compiled inside the server to render the tailored CV as a PDF (#38):
    "BSD-2-Clause",                  # arrayref, kamadak-exif, mutate_once (typst-pdf's image and PDF stack)
    "Apache-2.0 WITH LLVM-exception", # ar_archive_writer (via stacker, typst-eval)
    "0BSD",                          # roman-numerals-rs (typst-library), offered as 0BSD OR CC0-1.0
]

[licenses.private]
# All workspace crates are `publish = false` under LicenseRef-Sustainable-Use;
# they are ours and need no allow-list entry.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # rustls everywhere: no OpenSSL / platform TLS stacks.
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# NVIDIA OpenShell's Rust SDK and policy parser are published as a git tag
# (ADR 0002); the runs module and the policy lint depend on them.
allow-git = ["https://github.com/NVIDIA/OpenShell"]
