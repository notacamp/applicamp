# The e2e stack's (and a laptop demo's) job boards, served by the fake
# (clients/app/scripts/fake-jobs.ts). Invented: no real board. Tests only.
#
# One approved remote board, shaped like Himalayas' API, and one candidate
# waiting for the owner with its check, for the Boards page.

[[board]]
slug = "fake-remote"
name = "Fake Remote Board"
homepage = "http://fake-jobs:9020"
kind = "json_api"
priority = "high"
status = "approved"

[board.config]
endpoint = "http://fake-jobs:9020/himalayas/jobs/api"
items = "/jobs"
cursor = { param = "cursor", from = "/nextCursor" }
poll_minutes = 15
remote_only = true

[board.config.fields]
ref = "/guid"
title = "/title"
company = "/companyName"
url = "/guid"
apply_url = "/applicationLink"
regions = "/locationRestrictions"
description = "/description"
posted_at = "/pubDate"
expires_at = "/expiryDate"
salary_min = "/minSalary"
salary_max = "/maxSalary"
salary_currency = "/currency"
salary_period = "/salaryPeriod"

[board.terms]
attribution = "Fake Remote Board"
link_back = true
follow = true
apply_unchanged = true
drop_expired = true
notes = "An invented board for tests."

[[board]]
slug = "fake-waiting"
name = "Fake Waiting Board"
homepage = "https://waiting-board.example"
kind = "rss"
priority = "low"
status = "candidate"
country = "CH"

[board.config]
endpoint = "https://waiting-board.example/feed.xml"

[board.config.fields]
title = "title"
url = "link"
description = "description"
posted_at = "pubDate"

[board.report]
checked_at = "2026-10-26T04:00:00Z"
terms_url = "https://waiting-board.example/terms"
terms_sentences = ["You may not scrape this site with automated tools.", "Please link back to the original posting."]
found_kind = "rss"
found_url = "https://waiting-board.example/feed.xml"
sample = [{ title = "Senior Backend Engineer", company = "Example Co", location = "Zurich", url = "https://waiting-board.example/jobs/1", regions = [] }]
remote_share = 0.2
worldwide_share = 0.0
language = "en"
attribution = "Fake Waiting Board"
flags = ["its terms mention scraping or automated access: read them"]
notes = "Country-scoped (Switzerland), found by discovery. Invented for tests."

[board.report.robots]
host = "waiting-board.example"
found = true
rules = [{ allow = false, pattern = "/private" }]
endpoint_allowed = true
fingerprint = "e2e"
